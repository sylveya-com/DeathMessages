# DeathMessages - Configuration for message recoloring
# Uses MiniMessage format: https://docs.advntr.dev/minimessage/

Colors:
  Death:
    Main: "<dark_red>"
    Player: "<dark_aqua>"
    Killer: "<dark_aqua>"
    Weapon: "<gold>"

  Join:
    Main: "<gray>"
    Player: "<gray>"

  Quit:
    Main: "<gray>"
    Player: "<gray>"

Settings:
  # Minimum playtime in minutes before a player's death/join/quit messages are shown (0 = no minimum)
  Min-Playtime-Minutes: 0
  # Cooldown in seconds between a player's death messages being broadcast
  Death-Message-Cooldown-Seconds: 10
  # Enable or disable death messages globally
  Death-Messages: true
  # Enable or disable join messages globally
  Join-Messages: true
  # Enable or disable quit messages globally
  Quit-Messages: true
  # Show an item tooltip when hovering the weapon name in death messages
  Weapon-Hover: true

Commands:
  DeathMessages:
    Prefix: '<gray>[DeathMessages]<reset> '
    Player-Only-Command: '<red>Only players can run this command.'
    No-Permission: '<prefix><red>You do not have permission for this command.'
    Help:
    - '<dark_aqua>-----------------------------------------------------'
    - '<gray>/deathmessages blacklist <username> <dark_gray>- <gray>Blacklists a player so you no longer see their death messages.'
    - '<gray>/deathmessages toggle <dark_gray>- <gray>Toggle whether you see others'' death messages.'
    - '<dark_aqua>-----------------------------------------------------'
    Sub-Commands:
      Reload:
        Reloaded: '<prefix><green>Reloaded all plugin configs.'
      Toggle:
        Toggle-On: '<gold>Death messages unhidden.'
        Toggle-Off: '<gold>Death messages hidden.'
      Blacklist:
        Help: '<red>Usage: /dm blacklist <username>'
        Username-None-Existent: '<prefix><red>Could not find the player with the username <yellow><player>'
        Blacklist-Add: '<gold>Now blacklisting <dark_aqua><player>'
        Blacklist-Remove: '<gold>No longer blacklisting <dark_aqua><player>'

