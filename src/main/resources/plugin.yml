name: DeathMessages
version: '${project.version}'
main: me.lokspel.deathmessages.DeathMessages
api-version: '1.21'
folia-supported: true

commands:
  deathmessages:
    aliases: [dm]
    description: Main DeathMessages command.
    usage: /<command> <reload|toggle|blacklist>
  toggleconnectionmsg:
    aliases: [togglejoins]
    description: Toggle join/quit messages on or off.
    usage: /<command>
  deathmessagestoggle:
    aliases: [dmtoggle, dmt]
    description: Shortcut to toggle death messages.
    usage: /<command>
